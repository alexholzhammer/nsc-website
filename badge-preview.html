<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge Icon Preview</title>
<style>
  body {
    background: #111827;
    display: flex;
    gap: 80px;
    padding: 80px;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
  }
  .badge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .icon-wrap {
    color: #FBBF24;
  }
  .sizes {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .sizes span {
    color: #6B7280;
    font-size: 11px;
    text-align: center;
  }
  .label {
    color: #F3F4F6;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }
  .tooltip-text {
    color: #9CA3AF;
    font-size: 12px;
    text-align: center;
    font-style: italic;
  }
  hr {
    border: none;
    border-top: 1px solid #374151;
    width: 100%;
    margin: 0;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 16px;
  }
</style>
</head>
<body>

<!-- DUCK FOOT — 3+ camps -->
<div class="badge">
  <div class="sizes">
    <span>Large (48px)</span>
    <div class="row">
      <div class="icon-wrap">
        <svg width="48" height="48" viewBox="0 0 32 38" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="
            M 16 37
            Q 8 32 6 25
            Q 3 18 3 14
            Q 4 6 7 4
            Q 10 1 12 6
            Q 13 11 13 14
            L 14 16
            Q 14 8 16 3
            Q 18 8 18 16
            L 19 14
            Q 19 6 22 4
            Q 25 1 29 7
            Q 31 14 29 20
            Q 27 26 24 32
            Q 20 35 16 37 Z
          "/>
        </svg>
      </div>
    </div>
    <span>Small (20px)</span>
    <div class="row">
      <div class="icon-wrap">
        <svg width="20" height="20" viewBox="0 0 32 38" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="
            M 16 37
            Q 8 32 6 25
            Q 3 18 3 14
            Q 4 6 7 4
            Q 10 1 12 6
            Q 13 11 13 14
            L 14 16
            Q 14 8 16 3
            Q 18 8 18 16
            L 19 14
            Q 19 6 22 4
            Q 25 1 29 7
            Q 31 14 29 20
            Q 27 26 24 32
            Q 20 35 16 37 Z
          "/>
        </svg>
      </div>
    </div>
  </div>
  <div class="label">Duck foot</div>
  <div class="tooltip-text">"Went to 3 or more Camps"</div>
</div>

<!-- BEAR PAW — 5+ camps -->
<div class="badge">
  <div class="sizes">
    <span>Large (48px)</span>
    <div class="row">
      <div class="icon-wrap">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <!-- 4 toe beans -->
          <circle cx="6"  cy="9"  r="4"/>
          <circle cx="13" cy="5"  r="4"/>
          <circle cx="20" cy="5"  r="4"/>
          <circle cx="27" cy="9"  r="4"/>
          <!-- Main pad -->
          <ellipse cx="16" cy="22" rx="11" ry="9"/>
        </svg>
      </div>
    </div>
    <span>Small (20px)</span>
    <div class="row">
      <div class="icon-wrap">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6"  cy="9"  r="4"/>
          <circle cx="13" cy="5"  r="4"/>
          <circle cx="20" cy="5"  r="4"/>
          <circle cx="27" cy="9"  r="4"/>
          <ellipse cx="16" cy="22" rx="11" ry="9"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="label">Bear paw</div>
  <div class="tooltip-text">"Went to 5 or more Camps"</div>
</div>

<!-- BONFIRE — 3+ wins -->
<div class="badge">
  <div class="sizes">
    <span>Large (48px)</span>
    <div class="row">
      <div class="icon-wrap">
        <svg width="48" height="48" viewBox="0 0 32 36" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <!-- Main flame -->
          <path d="
            M 16 4
            C 13 8 9 13 10 18
            C 7 15 6 10 8 7
            C 5 11 4 17 7 21
            C 9 25 12 27 16 28
            C 20 27 23 25 25 21
            C 28 17 27 11 24 7
            C 26 10 25 15 22 18
            C 23 13 19 8 16 4 Z
          "/>
          <!-- Left log -->
          <ellipse cx="10" cy="32" rx="8" ry="2" transform="rotate(-18 10 32)"/>
          <!-- Right log -->
          <ellipse cx="22" cy="32" rx="8" ry="2" transform="rotate(18 22 32)"/>
        </svg>
      </div>
    </div>
    <span>Small (20px)</span>
    <div class="row">
      <div class="icon-wrap">
        <svg width="20" height="20" viewBox="0 0 32 36" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="
            M 16 4
            C 13 8 9 13 10 18
            C 7 15 6 10 8 7
            C 5 11 4 17 7 21
            C 9 25 12 27 16 28
            C 20 27 23 25 25 21
            C 28 17 27 11 24 7
            C 26 10 25 15 22 18
            C 23 13 19 8 16 4 Z
          "/>
          <ellipse cx="10" cy="32" rx="8" ry="2" transform="rotate(-18 10 32)"/>
          <ellipse cx="22" cy="32" rx="8" ry="2" transform="rotate(18 22 32)"/>
        </svg>
      </div>
    </div>
  </div>
  <div class="label">Bonfire</div>
  <div class="tooltip-text">"Won 3 or more Camps"</div>
</div>

</body>
</html>
