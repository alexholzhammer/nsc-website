<!-- Shared site header. Injected into #nav-placeholder by /components.js.
     This is a fragment on purpose — no <html>, <head> or <body>.
     Edit the nav here and every page picks it up.
     The active link is set at runtime from location.pathname, so there is
     nothing page-specific in this file.
     The "Newsletter" link opens the beehiiv popup — it carries the
     .js-beehiiv-newsletter hook that the beehiiv form's on-click trigger
     is configured against (see components.js). -->
<header class="site-header" id="site-header">
  <div class="site-header__inner">
    <a class="site-header__logo" href="/"><img src="/nsc-logo-black.avif" alt="NSC" class="site-header__logo-img"></a>
    <nav class="site-header__nav" aria-label="Main">
      <a class="site-header__link" href="/">Home</a>
      <a class="site-header__link" href="/rankings">Rankings</a>
      <a class="site-header__link" href="/about">About</a>
      <a class="site-header__link" href="/past-camps">Past Camps</a>
      <a class="site-header__link js-beehiiv-newsletter" href="#">Newsletter</a>
    </nav>
    <button class="btn-primary btn-primary--sm site-header__cta" data-tally-open="zxDW8M" data-tally-layout="modal" data-tally-width="800" data-tally-emoji-text="🥳" data-tally-emoji-animation="none" data-tally-form-events-forwarding="1">Book Your Spot</button>
  </div>
</header>
