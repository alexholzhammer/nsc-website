<!-- Shared site header. Injected into #nav-placeholder by /components.js.
     This is a fragment on purpose — no <html>, <head> or <body>.
     Edit the nav here and every page picks it up.
     The active link is set at runtime from location.pathname, so there is
     nothing page-specific in this file.
     The "Newsletter" link opens the beehiiv popup — it carries the
     .js-beehiiv-newsletter hook that the beehiiv form's on-click trigger
     is configured against (see components.js). -->

      <a class="site-header__link" href="/about">About</a>

      <a class="site-header__link js-beehiiv-newsletter" href="#">Newsletter</a>
